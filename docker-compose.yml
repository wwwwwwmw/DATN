version: '3.9'

# =============================================
# MedTech AI Platform — Docker Compose
# =============================================
# Usage:
#   docker-compose up -d                  # Start all services
#   docker-compose up -d database redis   # Start infra only
#   docker-compose logs -f backend-api    # View logs
#   docker-compose down                   # Stop all

services:
  # ─────────────────────────────────────
  # DATABASE (PostgreSQL + PostGIS + pgvector)
  # ─────────────────────────────────────
  database:
    build: ./database
    container_name: medtech-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-medtech_db}
      POSTGRES_USER: ${DB_USER:-medtech_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medtech_user} -d ${DB_NAME:-medtech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medtech-network

  # ─────────────────────────────────────
  # REDIS (Channel Layer + Cache)
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medtech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - medtech-network

  # ─────────────────────────────────────
  # BACKEND API (Django + DRF + Channels)
  # ─────────────────────────────────────
  backend-api:
    build: ./backend-api
    container_name: medtech-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgis://${DB_USER:-medtech_user}:${DB_PASSWORD}@database:5432/${DB_NAME:-medtech_db}
      - REDIS_URL=redis://redis:6379/0
      - AI_VISION_URL=http://ai-vision:8001
      - LLM_RAG_URL=http://llm-rag:8002
      - SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DEBUG=${DJANGO_DEBUG:-False}
      - ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - medtech-network

  # ─────────────────────────────────────
  # AI VISION (FastAPI + PyTorch + DenseNet121)
  # ─────────────────────────────────────
  ai-vision:
    build: ./ai-vision
    container_name: medtech-ai-vision
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=/app/weights/best_densenet121.pth
      - DEVICE=${AI_VISION_DEVICE:-cpu}
      - CONFIDENCE_THRESHOLD=${AI_VISION_CONFIDENCE_THRESHOLD:-0.5}
    volumes:
      - ./ai-vision/weights:/app/weights:ro
    # Uncomment below for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - medtech-network

  # ─────────────────────────────────────
  # LLM RAG (FastAPI + LangChain + pgvector)
  # ─────────────────────────────────────
  llm-rag:
    build: ./llm-rag
    container_name: medtech-llm-rag
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-medtech_user}:${DB_PASSWORD}@database:5432/${DB_NAME:-medtech_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - LLM_MODEL=${LLM_MODEL:-gpt-3.5-turbo}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - medtech-network

  # ─────────────────────────────────────
  # FRONTEND WEB (React + Vite)
  # ─────────────────────────────────────
  frontend-web:
    build: ./frontend-web
    container_name: medtech-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    networks:
      - medtech-network

  # ─────────────────────────────────────
  # NGINX Reverse Proxy (Production only)
  # ─────────────────────────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: medtech-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - static_data:/usr/share/nginx/static:ro
  #     - media_data:/usr/share/nginx/media:ro
  #   depends_on:
  #     - frontend-web
  #     - backend-api
  #   networks:
  #     - medtech-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  medtech-network:
    driver: bridge
